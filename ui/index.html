<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typst Studio</title>
  </head>
  <body>
    <header>
      <span class="controls">
        <button id="open-project" type="button"></button>
        <button id="save" type="button"></button>
        <button id="preview-this" type="button"></button>
        <button id="export" type="button"></button>
      </span>
      <span id="file-status" class="file-status"></span>
      <span id="status"></span>
      <span class="controls">
        <select id="language"></select>
        <button id="new-window" type="button"></button>
      </span>
    </header>
    <main>
      <nav id="files"></nav>
      <div id="editor"></div>
      <div id="preview"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
